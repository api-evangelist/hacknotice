note: 'HackNotice publishes exactly one, unusually strict, global limit and states it in the
  description of its own API documentation: "The HackNotice API has a governor on it that rate
  limits queries to 1 query per second." That is the whole published limit surface — the docs
  name no per-plan tiers, no burst allowance, no quota, and no rate-limit response headers, and
  the response headers could not be observed because every production endpoint on
  extensionapi.hacknotice.com returns 401 before routing to an anonymous caller. An integrating
  agent must therefore self-throttle to 1 rps and treat any runtime rate-limit signal as
  undocumented.'
