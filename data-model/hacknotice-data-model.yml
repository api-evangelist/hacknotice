calculation_resources:
  note: 'A distinct family of rollup resources — breachcalcs, threatactorcalcs, domainalertcalcs,
    hackalertcalcs, enduseralertcalcs — that return aggregates rather than entities. They are the
    backing surface for the platform dashboards (Attack Heatmap, Adversary Attack Matrix, Ransomware,
    Global Breaches, Third Party) and have no MCP tool equivalent.'
  resources: [breachcalcs, threatactorcalcs, domainalertcalcs, hackalertcalcs, enduseralertcalcs]
