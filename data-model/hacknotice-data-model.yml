note: 'Derived from the resource graph of the 249 operations in the derived OpenAPI and the 80 MCP
  tool inputSchemas. HackNotice publishes no components.schemas — the Postman collection this was
  built from carries request shapes but no reusable response models — so entities below are inferred
  from route structure, path parameters and request-body fields, not from a declared schema. Field
  lists are therefore indicative, and relationships are stated only where a route or an inputSchema
  makes the link explicit.'
id_convention:
  format: 24-character lowercase hexadecimal (MongoDB ObjectId)
  path_parameter_names: [documentId, assessmentId, eventId, templateId, inviteId, fileId, watchlistId, alertId, noteId, customerId]
  prefixed_ids: false
  note: 'Ids are untyped ObjectIds with no resource prefix, so an id alone does not tell an agent
    which collection it belongs to — a meaningful contrast with prefixed-id APIs, and a real source
    of cross-resource mistakes.'
domains:
