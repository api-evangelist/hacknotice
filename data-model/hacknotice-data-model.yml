  entities: [customer, user, auth]
- name: First-party monitoring
  entities: [domainwatchlist, domainalerts, domainleaks, domainalertcalcs]
- name: Third-party monitoring
  entities: [hackwatchlist, hackalerts, hacks, hackalertcalcs, breaches, breachupdatedlog, breachcalcs]
- name: End-user monitoring
  entities: [enduserwatchlist, enduseralerts, enduserleaks, enduseralertcalcs]
- name: Research
  entities: [research, researchsavedsearch, leakfile, leakReportsv2, leakfilestats]
- name: Vendor assessments
  entities: [assessments, assessmentevents, assessmenttemplates, assessmentinvites, assessmentdatafiles, assessmentpreferences]
- name: Cross-cutting
  entities: [itemnotes, downloads, report, threatactorcalcs, hacknoticeupdates, utils]
entities:
- name: customer
  description: The tenant. Every other object is scoped to a customer, and the customer_id is carried inside the JWT rather than passed as a parameter.
  operations: 3
  key: customerId
- name: domainwatchlist
  description: A first-party domain the customer owns and wants monitored.
  operations: 6
  key: watchlistId
- name: domainalerts
  description: An alert raised against a first-party domain. The single largest resource in the API.
  operations: 19
  key: alertId
  sub_resources: [domainalertscreds, domainalertsleaks]
- name: hackwatchlist
  description: A third-party vendor the customer wants monitored.
  operations: 9
  key: watchlistId
- name: hackalerts
  description: An alert raised against a monitored third-party vendor.
  operations: 17
  key: alertId
- name: enduserwatchlist
  description: An end-user identity (typically a business email) under monitoring.
  operations: 6
  key: watchlistId
- name: enduseralerts
  description: An alert raised against a monitored end user.
  operations: 14
  key: alertId
  sub_resources: [enduseralertscreds, enduseralertsleaks]
- name: breaches
  description: A breach/hack incident record in HackNotice's research database, independent of any one customer.
  operations: 6
- name: leakfile
  description: A file recovered from a leak, searchable by filename, term and word pool.
  operations: 3
  key: documentId
- name: leakReportsv2
  description: Structured leak report record. The "v2" in the resource name is the API's only version signal.
  operations: 3
  key: documentId
- name: researchsavedsearch
  description: A stored research query, reusable as savedSearchJson / researchSavedSearchJson input to the alert tools.
  operations: 8
- name: assessments
  description: A vendor security assessment, optionally AI-scored.
  operations: 9
  key: assessmentId
- name: assessmenttemplates
  description: A reusable questionnaire template; frameworks are enumerated by GET /assessmenttemplates/frameworks.
  operations: 7
  key: templateId
- name: assessmentinvites
  description: An invitation for a vendor to complete an assessment, activated by an invite code.
  operations: 9
  key: inviteId
  alternate_key: inviteCode
- name: assessmentevents
  description: A lifecycle event on an assessment; has a parallel "invited" variant for the vendor side.
  operations: 11
  key: eventId
- name: assessmentdatafiles
  description: A document uploaded in support of an assessment; has a parallel "invited" variant.
  operations: 12
  key: fileId
- name: assessmentpreferences
  description: Per-customer assessment configuration. A singleton — no id in the path.
  operations: 4
  cardinality: singleton
- name: itemnotes
  description: Free-text analyst notes attachable to alerts and other items. Cross-cutting.
  operations: 12
  key: noteId
