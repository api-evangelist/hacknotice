note: 'HackNotice publishes NO AsyncAPI document. It does document a real, if deliberately minimal,
  outbound event surface: batched webhook notifications for each of its three monitoring services,
  a Slack incoming-webhook destination, and a Splunk HTTP Event Collector destination. Captured here
  as a webhook catalogue and wired as common[].type Webhooks. The payload contract is intentionally
  thin by design, which is the most important fact about it for an integrator.'
delivery:
  model: outbound-webhook
  cadence: 'Batch, evaluated every 12 hours. A notification is sent only when new alerts have been added to a service timeline since the previous run.'
  real_time: false
  configuration: 'Configured in-app under Business > Account > Account. Not configurable through the REST API — no webhook-subscription resource appears in the published collection.'
  licensing: 'Webhook notifications are generated only for services included in the subscription. An unlicensed service emits nothing.'
channels:
- name: third-party-monitoring-alerts
  service: Third Party Monitoring
  trigger: New alerts added to the third-party vendor watchlist timeline in the last 12 hours
  payload_fields: [alert_count, platform_link]
  example_link: https://app.hacknotice.com/#/thirdparty/watchlist
- name: first-party-monitoring-alerts
  service: First Party Monitoring
  trigger: New alerts added to the first-party domain timeline in the last 12 hours
  payload_fields: [alert_count, platform_link]
- name: end-user-monitoring-alerts
  service: End User Monitoring
  trigger: New alerts added to the end-user timeline in the last 12 hours
  payload_fields: [alert_count, platform_link]
  example_body: 'End Users have 211 new alerts.'
payload_contract:
  included: [Number of new alerts, Direct link to the corresponding service in the HackNotice platform]
  excluded: [Usernames, Domains, Breach details, Passwords, Threat context, Any other sensitive information]
  rationale: 'Deliberate security design — alert detail stays behind the platform login. HackNotice states plainly that webhooks "intentionally contain only summary information".'
  integrator_consequence: 'A webhook is a doorbell, not a message. Any agent or SIEM pipeline must call the REST API or the MCP server after receiving one in order to learn what actually happened.'
