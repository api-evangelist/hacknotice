generated: '2026-08-22'
method: probed
source: https://mcp.hacknotice.com:13330/mcp (JSON-RPC tools/list, HTTP 200, anonymous)
status: published
deployment:
  mode: both
  endpoint: https://mcp.hacknotice.com:13330/mcp
  install: npm install n8n-nodes-hacknotice-mcp
  package: https://www.npmjs.com/package/n8n-nodes-hacknotice-mcp
  auth: api-key
  verified: probed
  note: 'Remote Streamable-HTTP MCP server operated by HackNotice, plus a first-party n8n community node that speaks
    to that same fixed endpoint (HACKNOTICE_MCP_ENDPOINT_URL in github.com/HackNotice/n8n-nodes-hacknotice-mcp).
    The npm package is an MCP CLIENT for n8n, not a second server: mode is "both" because HackNotice ships a callable
    URL and an installable package, and the URL is the agent surface.'
server:
  name: hacknotice
  version: 0.1.0
  transport: streamable-http
  protocol_version: '2024-11-05'
  url: https://mcp.hacknotice.com:13330/mcp
  capabilities:
    tools:
      listChanged: true
  instructions: 'Use hacknotice_verify_credentials to confirm configuration. For ransomware attacks, data breaches,
    or "what happened to {company/domain}" questions, use search_global_breaches first — it returns breach details,
    recommendations.workflowActions (assessment/watchlist). When listing or counting assessments for a named vendor/company,
    ALWAYS pass term on hacknotice_assessment_list_assessments_page and hacknotice_assessment_count_assessments
    (e.g. term: "discover") — never fetch all assessments without a filter when the user named a vendor. Use hacknotice_list_saved_searches
    to discover saved-search payloads, then pass the JSON into the alert tools as savedSearchJson or researchSavedSearchJson.
    Time: timeRange (lastDay | lastWeek | lastMonth), or fixed startDate/endDate (ISO 8601), or hoursAgo/time_range_hours
    for 8–72 hour rolling windows only (values under 8 are treated as 8; over 72 requires a date range). Debug:
    when the user prompt contains [debug], pass debug: true on every HackNotice tool call in that turn — the tool
    response will include _debug with inbound MCP and outbound extension API request/response traces (secrets redacted).'
authentication:
  scheme: api-key
  header: X-HackNotice-Integration-Key
  key_prefix: hn_ik_
  note: tools/list and initialize answer ANONYMOUSLY (HTTP 200) — the tool catalogue and every inputSchema are public.
    The integration key is validated per tools/call against the HackNotice extension API, so discovery is open while
    execution is gated. /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource both 404
    on this host; there is no OAuth metadata.
tool_count: 80
summary:
  by_group:
    assessments: 49
    assessments-invited: 6
    third-party: 5
    first-party: 4
    end-user: 6
    general: 8
    research: 2
  read_only_tools: 38
  write_tools: 38
  tools_declaring_backing_rest: 57
tools_file: hacknotice-mcp-tools.json
initialize_file: hacknotice-mcp-initialize.json
