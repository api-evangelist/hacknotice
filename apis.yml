aid: hacknotice
name: HackNotice
description: 'HackNotice is an external threat-intelligence and cyber-risk platform founded in 2018 and headquartered
  in Austin, Texas. It continuously collects intelligence from ransomware groups, infostealer malware logs, data
  breaches, dark-web marketplaces, hacker forums and public disclosures, then matches that intelligence against the
  domains, employees, customers and vendors an organization asks it to watch. The product is organized around four
  monitoring services — first-party domain monitoring, third-party vendor risk monitoring, end-user credential
  monitoring, and threat research and investigations — plus AI-assisted vendor security assessments. HackNotice
  exposes this surface programmatically through a REST API documented as a public Postman collection at
  api-docs.hacknotice.com, a remote Model Context Protocol server at mcp.hacknotice.com whose tool catalogue answers
  anonymously, first-party n8n automation nodes on npm, and webhook, Splunk HEC and SIEM/SOAR alert delivery.'
