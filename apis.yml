apis:
- aid: hacknotice:hacknotice-mcp
  name: HackNotice MCP Server
  description: >-
    Remote Model Context Protocol server operated by HackNotice, speaking JSON-RPC 2.0 over Streamable
    HTTP at https://mcp.hacknotice.com:13330/mcp. It publishes 80 tools across third-party, first-party,
    end-user, research and assessment groups, plus cross-cutting global-breach, exposure, chatter, credential-leak,
    leaked-file and correlated-leak search. tools/list and initialize answer anonymously, so every tool
    inputSchema is public; tools/call is gated on a per-user X-HackNotice-Integration-Key.
  humanURL: https://github.com/HackNotice/n8n-nodes-hacknotice-mcp
  baseURL: https://mcp.hacknotice.com:13330/mcp
  tags:
  - MCP
  - Agents
  - Threat Intelligence
  - Security
