apis:
- aid: hacknotice:hacknotice-api
  name: HackNotice API
  description: 'REST API over the HackNotice threat-intelligence platform: authentication, leak and leak-file search,
    first-party domain watchlists and alerts, third-party vendor watchlists, hacks and alerts, end-user watchlists
    and alerts, threat-research search over terms, filenames and word pools, vendor security assessments with
    AI scoring, and aggregate calculation endpoints. Documented by HackNotice as a public Postman collection; access
    is granted to approved accounts after a consultation call.'
  humanURL: https://api-docs.hacknotice.com
