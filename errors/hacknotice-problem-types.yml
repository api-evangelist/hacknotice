envelope:
  shape: '{"message": "<human readable text>"}'
  members: [message]
  note: 'HackNotice returns a flat JSON object with a single free-text `message` member. There is no
    machine-readable error identity — no type URI, no numeric or symbolic code, no title, no detail,
    no instance — so a client cannot branch on error kind without string-matching English prose.
    HackNotice publishes no error reference page; the entries below are the statuses actually
    observed on live hosts plus the statuses the derived OpenAPI declares.'
