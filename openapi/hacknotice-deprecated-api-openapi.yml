      operationId: putUpdateHabits2
      description: 'Folder: Teams Accounts / Enterprise Habits.'
      parameters:
      - name: apikey
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remediations:
                  type: array
            example:
              remediations:
