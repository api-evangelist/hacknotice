      summary: Create template
      operationId: postCreateTemplate
      description: 'Folder: Assessments / assessmenttemplates. Create Assessment Template Purpose: Create a new customer-owned assessment template. Request Body Field Type Required Description name string ✅ Yes Name of the template description string No Human-readable description version number No Template version (default: 1 ) questions array No List of question objects active boolean No Whether the template is active (default: true ) frameworks array No List of associated framework names Body Example { "name": "Vendor Security Baseline", "description": "Core security due diligence template", "version": 1, "questions": [], "active": true, "frameworks": ["SOC 2", "ISO 27001"] } Server-Managed Fields These fields are set automatically by the API and should not be included in the request body: customer_id · user_id · timestamp · updated Defaults Field Default active true version 1 Responses Status Description 200 Created template object 400 name field is missing 401 Unauthorized user'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                version:
                  type: integer
                active:
                  type: boolean
                frameworks:
                  type: array
                questions:
                  type: array
            example:
              name: Ransomware Assessment
              description: A security posture assessment focused on the controls most relevant to ransomware attack vectors, including vulnerability and patch management, credential and access controls, remote access, endpoint and mobile device security, network segmentation, backup and recovery, and incident detection and response.
              version: 1
              active: true
              frameworks: []
              questions:
              - question: Have all critical and high-risk security patches been applied and validated across network devices?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 1
              - question: Are documented security standards enforced for network device configuration, patching, access control, password strength, and change authorization?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 2
              - question: Does a centrally managed vulnerability management program exist that covers system scanning, timely remediation, and exception handling?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 3
              - question: Are all systems and applications kept current through a regular patching cadence?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 4
              - question: Has leadership approved an access control policy governing system access rights based on data sensitivity and scope?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 5
              - question: Is a leadership-approved password policy in place that defines requirements for password creation, safeguarding, and lifecycle management?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 6
              - question: Does the password policy mandate that credentials remain confidential and are not shared?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 7
              - question: Are factory-default credentials on network devices changed or disabled before deployment to production?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 8
              - question: Are vendor-supplied default passwords eliminated or changed on all systems before they enter production use?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 9
              - question: Are controls in place to restrict personally-owned mobile devices from connecting to corporate systems and networks?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 10
              - question: Has a mobile device management program been implemented that enforces minimum security standards for accessing organizational systems, applications, and email?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 11
              - question: Do any unmanaged or non-corporate computing devices connect to the organization's network?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 12
              - question: Are any personally-owned (BYOD) mobile devices used to access scoped or sensitive data?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 13
              - question: Is a leadership-approved remote access policy in place for scoped systems and data, and is it reviewed at least annually?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 14
              - question: Does a DMZ exist to isolate internet-facing or externally accessible systems from the internal network?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 15
              - question: Is scoped data regularly backed up and stored at a separate offsite location?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 16
              - question: Does a documented incident response plan exist that clearly defines escalation procedures?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 17
              - question: Does ongoing security monitoring generate alerts for malware detections and anomalous or suspicious behavior?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 18
              - question: Are policies and procedures in place for detecting and reporting unauthorized access, use, or disclosure of scoped data?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 19
              - question: Are documented procedures maintained for identifying and reporting privacy incidents involving potential or actual compromise of client data?
                question_type: yes_no
                options:
                - 'Yes'
                - 'No'
                required: true
                order: 20
