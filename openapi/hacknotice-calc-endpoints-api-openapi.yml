              properties:
                startdate:
                  type: string
                enddate:
                  type: string
                naics:
                  type: string
                naicsarray:
                  type: array
                georegions:
                  type: string
                georegionsarray:
                  type: array
            example:
              startdate: '2025-04-01'
              enddate: '2025-05-01'
              naics: ''
              naicsarray: []
              georegions: ''
              georegionsarray: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized — missing or invalid JWT / API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - jwtAuth: []
      - apiKeyAuth: []
